<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Recognition</title>
    <!-- Bootstrap CSS CDN for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(to bottom right, #4c51bf, #8b5cf6, #ec4899);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: none;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <h1 class="text-center fw-bold display-5 mb-3 text-secondary-emphasis">Text-Based Emotion Recognition</h1>
                <p class="text-center text-muted mb-4">
                    Enter a piece of text to have its emotion classified by a machine learning model.
                </p>

                <!-- The form for user input, using POST method to send data to the server -->
                <form method="POST">
                    <div class="mb-4">
                        <label for="text" class="form-label h5 text-primary">Enter text here:</label>
                        <textarea
                            name="text"
                            id="text"
                            rows="5"
                            placeholder="e.g., 'I am so happy today!'"
                            class="form-control rounded-3"
                        ></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="model" class="form-label h5 text-primary">Choose Model:</label>
                        <select
                            name="model"
                            id="model"
                            class="form-select rounded-3"
                        >
                            <option value="logreg">Logistic Regression</option>
                            <option value="svm">Support Vector Machine</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 shadow-sm">
                        Predict Emotion
                    </button>
                </form>

                <!-- Placeholder for server-rendered results -->
                {% if text %}
                    <hr class="my-4">
                    <div class="mt-4">
                        <h3 class="h4 text-secondary-emphasis mb-3">Results:</h3>
                        <div class="alert alert-info border-info border-2" role="alert">
                            <h5 class="alert-heading text-info-emphasis">Input:</h5>
                            <p class="mb-0">{{ text }}</p>
                            <hr>
                            <h5 class="alert-heading text-info-emphasis">Predicted Emotion ({{ model }}):</h5>
                            <p class="mb-0 fw-bold">{{ emotion }}</p>
                        </div>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
    <!-- Bootstrap JS with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
